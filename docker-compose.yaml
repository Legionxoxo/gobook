services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pricing:
    build:
      context: .
      target: pricing
    ports:
      - "9090:9090"

  booking:
    build:
      context: .
      target: booking
    environment:
      REDIS_ADDR: redis:6379
      PRICING_ADDR: pricing:9090
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      pricing:
        condition: service_started

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    restart: always
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    user: redis
    depends_on:
      redis:
        condition: service_healthy
